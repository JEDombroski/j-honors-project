<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Floating Nodes with Tooltips</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    svg {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #f8f8f8;
    }

    /* Tooltip style */
    .tooltip {
      position: absolute;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 5px;
      border-radius: 5px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <svg id="viz"></svg>

  <!-- Tooltip container -->
  <div id="tooltip" class="tooltip"></div>

  <!-- Load D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <script>
    const width = window.innerWidth;
    const height = window.innerHeight;

    const nodes = [
      { id: "node1", radius: 20, color: "red", info: "This is node 1" },
      { id: "node2", radius: 25, color: "blue", info: "This is node 2" },
      { id: "node3", radius: 30, color: "green", info: "This is node 3" },
      { id: "node4", radius: 15, color: "orange", info: "This is node 4" },
      { id: "node5", radius: 22, color: "purple", info: "This is node 5" },
      { id: "node6", radius: 18, color: "pink", info: "This is node 6" },
      { id: "node7", radius: 26, color: "teal", info: "This is node 7" },
      { id: "node8", radius: 19, color: "gold", info: "This is node 8" },
      { id: "node9", radius: 24, color: "navy", info: "This is node 9" },
      { id: "node10", radius: 17, color: "lime", info: "This is node 10" },
      { id: "node11", radius: 21, color: "brown", info: "This is node 11" },
      { id: "node12", radius: 23, color: "magenta", info: "This is node 12" },
      { id: "node13", radius: 20, color: "cyan", info: "This is node 13" },
      { id: "node14", radius: 27, color: "gray", info: "This is node 14" },
      { id: "node15", radius: 16, color: "black", info: "This is node 15" }
    ];

    const links = [
      { source: "node1", target: "node2" },
      { source: "node1", target: "node3" },
      { source: "node2", target: "node4" },
      { source: "node3", target: "node5" },
      { source: "node5", target: "node6" }
    ];

    const svg = d3.select("#viz");

    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(100))
      .force("charge", d3.forceManyBody().strength(-150))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collision", d3.forceCollide().radius(d => d.radius + 5));

    const link = svg.selectAll("line")
      .data(links)
      .enter()
      .append("line")
      .attr("stroke", "#aaa")
      .attr("stroke-width", 2);

    const node = svg.selectAll("circle")
      .data(nodes)
      .enter()
      .append("circle")
      .attr("r", d => d.radius)
      .attr("fill", d => d.color)
      .call(d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended)
      );

    const tooltip = d3.select("#tooltip");

    node.on("mouseover", (event, d) => {
      tooltip.style("opacity", 1)
        .html(d.info)
        .style("left", (event.pageX + 10) + "px")
        .style("top", (event.pageY + 10) + "px");
    })
    .on("mouseout", () => {
      tooltip.style("opacity", 0);
    });

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      node
        .attr("cx", d => Math.max(d.radius, Math.min(width - d.radius, d.x))) // Constrain within bounds
        .attr("cy", d => Math.max(d.radius, Math.min(height - d.radius, d.y))); // Constrain within bounds
    });

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }
  </script>
</body>
</html>
