<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top Text Debug</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* Top text area */
    #top-text {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #222;
      color: #fff;
      text-align: center;
      line-height: 60px;
      font-size: 20px;
      z-index: 1000;
    }

    /* SVG pushed down below top bar */
    svg {
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100% - 60px);
      background: #f8f8f8;
    }
  </style>
</head>
<body>

  <!-- Top Text Area -->
  <div id="top-text">This is your top text area</div>

  <!-- Main Visualization -->
  <svg id="viz"></svg>

  <script>
    const svg = document.getElementById("viz");
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", 200);
    circle.setAttribute("cy", 200);
    circle.setAttribute("r", 40);
    circle.setAttribute("fill", "steelblue");
    svg.appendChild(circle);
  </script>

</body>
</html>
